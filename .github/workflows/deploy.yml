name: Deploy to InfinityFree

on:
  push:
    branches:
      - main # Every time someone pushes to main, this triggers instantly

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          # This protects your live server configuration from being overwritten
          exclude: |
            **/.git*
            **/.github/**
            **/start-server.bat
            **/SETUP.md
            **/.env
